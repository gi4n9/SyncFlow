server:
  port: 8080

spring:
  application:
    name: syncflow-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/syncflow_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:secretpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  # Required. Generate a private random secret of at least 32 bytes.
  secret: ${JWT_SECRET:jeKR>mj)mvng;X^y+(r0<E;)P:.#FXz|-8ilx+I^;Od}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

auth:
  refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
